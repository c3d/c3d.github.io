<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Christophe de Dinechin - Interactive CV</title>
  <meta name="description" content="An interactive 3D constellation of Christophe de Dinechin's career in software development">
  <link rel="icon" type="image/png" href="/cv/logo.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
      font-size: 18px;
      pointer-events: none;
    }

    #loading.hidden {
      display: none;
    }

    #loading img {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    #controls {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      pointer-events: auto;
      max-width: 300px;
      backdrop-filter: blur(10px);
    }

    #controls h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      font-weight: 600;
    }

    #controls p {
      margin: 5px 0;
      line-height: 1.4;
    }

    .control-key {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 12px;
    }

    #title-overlay {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      z-index: 3;
    }

    #title-overlay h1 {
      font-size: 32px;
      font-weight: 300;
      margin: 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    #title-overlay p {
      font-size: 16px;
      font-weight: 300;
      margin: 5px 0 0 0;
      opacity: 0.8;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    .star-card {
      position: absolute;
      background: rgba(0, 0, 0, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 24px;
      width: 500px;
      max-width: 90vw;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      pointer-events: auto;
      transform-style: preserve-3d;
    }

    .star-card h2 {
      margin: 0 0 8px 0;
      font-size: 24px;
      font-weight: 600;
      color: #fff;
    }

    .star-card .meta {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 16px;
    }

    .star-card .theme-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      margin-right: 8px;
    }

    .star-card .content {
      line-height: 1.6;
      color: #ddd;
    }

    .star-card h3 {
      margin: 20px 0 10px 0;
      font-size: 18px;
      font-weight: 600;
    }

    .star-card p {
      margin: 10px 0;
    }

    .star-card a {
      color: #6cf;
      text-decoration: none;
    }

    .star-card a:hover {
      text-decoration: underline;
    }

    .star-card ul {
      margin: 10px 0;
      padding-left: 20px;
    }

    .star-card li {
      margin: 5px 0;
    }

    .star-card .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      margin: 16px 0;
      border-radius: 8px;
    }

    .star-card .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .star-card img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 16px 0;
    }

    .star-card .links {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .star-card .link-button {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 6px;
      margin: 4px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      transition: background 0.2s;
    }

    .star-card .link-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .close-button {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 20px;
      border-radius: 50%;
      cursor: pointer;
      line-height: 1;
      transition: background 0.2s;
    }

    .close-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    @media (max-width: 768px) {
      #title-overlay h1 {
        font-size: 24px;
      }

      #title-overlay p {
        font-size: 14px;
      }

      #controls {
        bottom: 10px;
        left: 10px;
        right: 10px;
        max-width: none;
        font-size: 12px;
      }

      .star-card {
        width: 95vw;
        padding: 16px;
      }

      .star-card h2 {
        font-size: 20px;
      }
    }

    @media print {
      body {
        overflow: visible;
        background: #fff;
        color: #000;
      }

      #canvas-container,
      #controls,
      #ui-overlay {
        display: none;
      }

      #print-view {
        display: block !important;
      }
    }

    #print-view {
      display: none;
      padding: 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    #print-view h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #000;
    }

    #print-view .subtitle {
      text-align: center;
      font-size: 18px;
      color: #666;
      margin-bottom: 30px;
    }

    #print-view .theme-section {
      margin-bottom: 30px;
    }

    #print-view .theme-section h2 {
      font-size: 20px;
      color: #000;
      border-bottom: 2px solid #000;
      padding-bottom: 5px;
      margin-bottom: 15px;
    }

    #print-view .project {
      margin-bottom: 15px;
    }

    #print-view .project h3 {
      font-size: 16px;
      color: #000;
      margin-bottom: 5px;
    }

    #print-view .project .years {
      font-size: 14px;
      color: #666;
      margin-bottom: 5px;
    }

    #print-view .project p {
      font-size: 14px;
      color: #333;
      line-height: 1.4;
    }

    #print-view .qr-section {
      text-align: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    #print-view .qr-section img {
      width: 80px;
      height: 80px;
    }

    #print-view .qr-section .qr-text {
      text-align: left;
    }

    #print-view .qr-section p {
      font-size: 14px;
      color: #666;
      margin: 5px 0;
    }
  </style>
  <script type="module" crossorigin src="/cv/assets/main-Dj8HCv6d.js"></script>
</head>
<body>
  <div id="loading">
    <img src="/cv/logo.png" alt="Christophe de Dinechin">
    <p>Loading constellation...</p>
  </div>

  <div id="canvas-container"></div>

  <div id="ui-overlay"></div>

  <div id="title-overlay">
    <h1>Christophe de Dinechin</h1>
    <p>Software as a Passion</p>
  </div>

  <div id="controls">
    <h3>Navigation</h3>
    <p><span class="control-key">Click</span> a star to explore</p>
    <p><span class="control-key">Drag</span> to orbit</p>
    <p><span class="control-key">Scroll</span> to zoom</p>
    <p><span class="control-key">O</span> Overview mode</p>
    <p><span class="control-key">ESC</span> Close card</p>
  </div>

  <div id="print-view"></div>

</body>
</html>
