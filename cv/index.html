<body>
  <div id="loading">
    <img src="/cv/logo.png" alt="Christophe de Dinechin">
    <p>Loading constellation...</p>
  </div>

  <div id="canvas-container"></div>

  <div id="ui-overlay"></div>

  <div id="title-overlay">
    <a class="title-print-link" href="/cv/?print=1" title="Printable CV" aria-label="Open printable CV">
      <h1>Christophe de Dinechin</h1>
    </a>
    <p>Software as a Passion</p>
  </div>

  <div id="controls">
    <h3>Navigation</h3>
    <p><span class="control-key">Click</span> a CV bullet-star</p>
    <p><span class="control-key">Drag</span> to orbit</p>
    <p><span class="control-key">Scroll</span> to zoom</p>
    <p><span class="control-key">O</span> Overview</p>
    <p><span class="control-key">ESC</span> Close HUD</p>
  </div>

  <div id="label-layer" aria-hidden="true"></div>

  <aside id="hud" aria-hidden="true">
    <div class="hud-panel">
      <button id="hud-close" type="button" aria-label="Close">×</button>
      <div class="hud-kicker" data-hud="theme">THEME</div>
      <h2 class="hud-project" data-hud="project">Project</h2>
      <div class="hud-index" data-hud="index">NODE 000 / 000</div>
      <div class="hud-readouts">
        <div class="hud-chip"><span>Section</span><div data-hud="section">—</div></div>
        <div class="hud-chip"><span>Years</span><div data-hud="years">—</div></div>
      </div>
      <p class="hud-bullet" data-hud="bullet"></p>
      <div data-hud="media"></div>
      <div class="hud-connected" data-hud="connected" hidden>
        <h3 class="hud-connected-title">Connected topics</h3>
        <div class="hud-connected-list" data-hud="connected-list"></div>
      </div>
    </div>
  </aside>

  <div id="print-view"></div>

  <div id="warp-bar" hidden aria-hidden="true">
    <p class="warp-label" data-warp-label>NEXT WARP JUMP IN 10 SECONDS</p>
    <div class="warp-track"><div class="warp-fill" data-warp-fill></div></div>
  </div>

  <div id="print-style-menu" hidden aria-hidden="true" role="menu"></div>

</body>
