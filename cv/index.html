<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Christophe de Dinechin - Interactive CV</title>
  <meta name="description" content="An interactive 3D constellation of Christophe de Dinechin's career in software development">
  <link rel="icon" type="image/png" href="/cv/logo.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
      font-size: 18px;
      pointer-events: none;
    }

    #loading.hidden {
      display: none;
    }

    #loading img {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    #controls {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      pointer-events: auto;
      max-width: 300px;
      backdrop-filter: blur(10px);
    }

    #controls h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      font-weight: 600;
    }

    #controls p {
      margin: 5px 0;
      line-height: 1.4;
    }

    .control-key {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 12px;
    }

    #title-overlay {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      z-index: 3;
      transition: opacity 0.35s ease;
    }

    #title-overlay h1 {
      font-family: Orbitron, sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin: 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    #title-overlay p {
      font-size: 16px;
      font-weight: 300;
      margin: 5px 0 0 0;
      opacity: 0.8;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    /* Sci-fi HUD — right deck on desktop, bottom sheet on mobile */
    #hud {
      --hud-accent: #40e0ff;
      position: fixed;
      top: 0;
      right: 0;
      width: min(420px, 42vw);
      height: 100%;
      z-index: 20;
      pointer-events: none;
      transform: translateX(105%);
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      padding: 18px;
    }
    #hud.open {
      transform: translateX(0);
      pointer-events: auto;
    }
    .hud-panel {
      position: relative;
      height: calc(100% - 8px);
      overflow: auto;
      padding: 22px 20px 28px;
      background:
        linear-gradient(180deg, rgba(6,14,28,0.94), rgba(4,8,18,0.92)),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(120, 200, 255, 0.03) 2px,
          rgba(120, 200, 255, 0.03) 3px
        );
      border: 1px solid color-mix(in srgb, var(--hud-accent) 55%, transparent);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.5) inset,
        0 0 40px color-mix(in srgb, var(--hud-accent) 18%, transparent),
        -12px 0 40px rgba(0,0,0,0.45);
      clip-path: polygon(
        0 14px, 14px 0, calc(100% - 14px) 0, 100% 14px,
        100% calc(100% - 14px), calc(100% - 14px) 100%,
        14px 100%, 0 calc(100% - 14px)
      );
    }
    .hud-panel::before,
    .hud-panel::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid var(--hud-accent);
      opacity: 0.85;
    }
    .hud-panel::before { top: 8px; left: 8px; border-right: 0; border-bottom: 0; }
    .hud-panel::after { bottom: 8px; right: 8px; border-left: 0; border-top: 0; }
    .hud-kicker {
      font-family: Orbitron, sans-serif;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--hud-accent);
      margin-bottom: 6px;
    }
    .hud-project {
      font-family: Orbitron, sans-serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
      margin: 0 0 10px;
      color: #f2f7ff;
    }
    .hud-readouts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .hud-chip {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      padding: 8px 10px;
      font-size: 12px;
    }
    .hud-chip span {
      display: block;
      font-family: Orbitron, sans-serif;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(180,210,255,0.65);
      margin-bottom: 3px;
    }
    .hud-bullet {
      font-size: 16px;
      line-height: 1.55;
      color: #dce7f8;
      margin: 0 0 18px;
      padding: 12px 0;
      border-top: 1px solid rgba(255,255,255,0.1);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .hud-index {
      font-family: Orbitron, sans-serif;
      font-size: 10px;
      letter-spacing: 0.16em;
      color: rgba(160,200,255,0.7);
      margin-bottom: 14px;
    }
    .hud-video {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      margin: 0 0 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .hud-video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .hud-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .hud-links a {
      font-family: Orbitron, sans-serif;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      color: #041018;
      background: var(--hud-accent);
      padding: 8px 12px;
    }
    #hud-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      z-index: 2;
    }
    #hud-close:hover { border-color: var(--hud-accent); color: var(--hud-accent); }

    @media (max-width: 768px) {
      #title-overlay h1 { font-size: 20px; }
      #title-overlay p { font-size: 13px; }
      #controls {
        bottom: 10px;
        left: 10px;
        right: 10px;
        max-width: none;
        font-size: 12px;
      }
      #hud {
        top: auto;
        bottom: 0;
        right: 0;
        left: 0;
        width: 100%;
        height: min(58vh, 520px);
        transform: translateY(110%);
        padding: 10px;
      }
      #hud.open { transform: translateY(0); }
      .hud-panel {
        clip-path: polygon(
          0 12px, 12px 0, calc(100% - 12px) 0, 100% 12px,
          100% 100%, 0 100%
        );
      }
    }

    @media print {
      body {
        overflow: visible !important;
        background: #fff !important;
        color: #000 !important;
      }

      #canvas-container,
      #controls,
      #ui-overlay,
      #title-overlay,
      #loading,
      #hud {
        display: none !important;
      }

      #print-view {
        display: block !important;
      }
    }

    #print-view {
      display: none;
      padding: 28px 36px;
      max-width: 900px;
      margin: 0 auto;
      color: #041018;
      font-family: "Source Sans 3", sans-serif;
    }

    #print-view .print-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 2px solid #041018;
    }
    #print-view .print-header img.logo {
      width: 64px;
      height: 64px;
    }
    #print-view .print-header h1 {
      font-family: Orbitron, sans-serif;
      font-size: 26px;
      margin: 0;
      color: #041018;
      text-align: left;
    }
    #print-view .print-header .subtitle {
      margin: 4px 0 0;
      font-size: 15px;
      color: #445;
      text-align: left;
    }

    #print-view .theme-section {
      margin-bottom: 18px;
      break-inside: avoid;
    }
    #print-view .theme-section h2 {
      font-family: Orbitron, sans-serif;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: var(--theme-color, #246);
      display: inline-block;
      padding: 4px 10px;
      margin: 0 0 10px;
    }
    #print-view .project {
      margin: 0 0 10px 12px;
      padding-left: 10px;
      border-left: 3px solid var(--theme-color, #246);
    }
    #print-view .project h3 {
      font-size: 14px;
      margin: 0 0 2px;
      color: #041018;
    }
    #print-view .project .years {
      font-size: 12px;
      color: #556;
      margin-bottom: 4px;
    }
    #print-view .project ul {
      margin: 0;
      padding-left: 18px;
      font-size: 12px;
      color: #223;
      line-height: 1.35;
    }

    #print-view .qr-section {
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid #ccd;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
    }
    #print-view .qr-section img.qr {
      width: 96px;
      height: 96px;
      border: 1px solid #ccd;
    }
    #print-view .qr-section img.logo-sm {
      width: 56px;
      height: 56px;
    }
    #print-view .qr-section .qr-text {
      text-align: left;
      font-size: 13px;
      color: #334;
    }
    #print-view .qr-section .qr-text strong {
      font-family: Orbitron, sans-serif;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    /* Screen preview of print layout */
    body.print-preview #canvas-container,
    body.print-preview #controls,
    body.print-preview #ui-overlay,
    body.print-preview #title-overlay,
    body.print-preview #loading,
    body.print-preview #hud {
      display: none !important;
    }
    body.print-preview {
      overflow: auto;
      background: #e8ecf2;
    }
    body.print-preview #print-view {
      display: block;
      background: #fff;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15);
      margin: 24px auto;
    }
  </style>
  <script type="module" crossorigin src="/cv/assets/main-C5seTu4T.js"></script>
  <link rel="stylesheet" crossorigin href="/cv/assets/main-XiThfW6l.css">
</head>
<body>
  <div id="loading">
    <img src="/cv/logo.png" alt="Christophe de Dinechin">
    <p>Loading constellation...</p>
  </div>

  <div id="canvas-container"></div>

  <div id="ui-overlay"></div>

  <div id="title-overlay">
    <h1>Christophe de Dinechin</h1>
    <p>Software as a Passion</p>
  </div>

  <div id="controls">
    <h3>Navigation</h3>
    <p><span class="control-key">Click</span> a CV bullet-star</p>
    <p><span class="control-key">Drag</span> to orbit</p>
    <p><span class="control-key">Scroll</span> to zoom</p>
    <p><span class="control-key">O</span> Overview</p>
    <p><span class="control-key">ESC</span> Close HUD</p>
  </div>

  <aside id="hud" aria-hidden="true">
    <div class="hud-panel">
      <button id="hud-close" type="button" aria-label="Close">×</button>
      <div class="hud-kicker" data-hud="theme">THEME</div>
      <h2 class="hud-project" data-hud="project">Project</h2>
      <div class="hud-index" data-hud="index">NODE 000 / 000</div>
      <div class="hud-readouts">
        <div class="hud-chip"><span>Section</span><div data-hud="section">—</div></div>
        <div class="hud-chip"><span>Years</span><div data-hud="years">—</div></div>
      </div>
      <p class="hud-bullet" data-hud="bullet"></p>
      <div data-hud="media"></div>
    </div>
  </aside>

  <div id="print-view"></div>

</body>
</html>
