<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Christophe de Dinechin - Interactive CV</title>
  <meta name="description" content="An interactive 3D constellation of Christophe de Dinechin's career in software development">
  <link rel="icon" type="image/png" href="/cv/logo.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
      font-size: 18px;
      pointer-events: none;
    }

    #loading.hidden {
      display: none;
    }

    #loading img {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    #controls {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      pointer-events: auto;
      max-width: 300px;
      backdrop-filter: blur(10px);
    }

    #controls h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      font-weight: 600;
    }

    #controls p {
      margin: 5px 0;
      line-height: 1.4;
    }

    .control-key {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 12px;
    }

    #title-overlay {
      --hud-accent: #40e0ff;
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 14;
      text-align: center;
      pointer-events: none;
      max-width: min(520px, calc(100vw - 24px));
      padding: 12px 18px 14px;
      background-color: rgba(4, 10, 22, 0.42);
      background-image:
        linear-gradient(165deg, rgba(14, 32, 58, 0.36), rgba(4, 10, 22, 0.3)),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(120, 200, 255, 0.03) 3px,
          rgba(120, 200, 255, 0.03) 4px
        );
      backdrop-filter: blur(18px) saturate(1.3);
      -webkit-backdrop-filter: blur(18px) saturate(1.3);
      border: 1px solid color-mix(in srgb, var(--hud-accent) 60%, transparent);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.3) inset,
        0 0 22px color-mix(in srgb, var(--hud-accent) 22%, transparent),
        0 8px 28px rgba(0, 0, 0, 0.28);
      clip-path: polygon(
        0 10px, 10px 0, calc(100% - 10px) 0, 100% 10px,
        100% calc(100% - 10px), calc(100% - 10px) 100%,
        10px 100%, 0 calc(100% - 10px)
      );
      transition: opacity 0.35s ease;
    }
    #title-overlay::before,
    #title-overlay::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      border: 2px solid var(--hud-accent);
      opacity: 0.8;
      pointer-events: none;
    }
    #title-overlay::before { top: 6px; left: 6px; border-right: 0; border-bottom: 0; }
    #title-overlay::after { bottom: 6px; right: 6px; border-left: 0; border-top: 0; }

    #title-overlay a.title-print-link {
      pointer-events: auto;
      display: inline-block;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      position: relative;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      transition: transform 0.2s ease;
    }
    #title-overlay a.title-print-link::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(#40e0ff var(--hold, 0%), transparent 0);
      opacity: 0;
      pointer-events: none;
      z-index: -1;
      transition: opacity 0.15s ease;
      mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
    }
    #title-overlay a.title-print-link.holding::after {
      opacity: 0.9;
      animation: title-hold-fill 0.5s linear forwards;
    }
    @keyframes title-hold-fill {
      from { --hold: 0%; }
      to { --hold: 100%; }
    }
    @property --hold {
      syntax: "<percentage>";
      inherits: false;
      initial-value: 0%;
    }

    #title-overlay h1 {
      font-family: Orbitron, sans-serif;
      font-size: clamp(16px, 3.6vw, 24px);
      font-weight: 700;
      letter-spacing: 0.05em;
      margin: 0;
      color: #f2f7ff;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      transition: text-shadow 0.25s ease, color 0.25s ease;
    }

    #title-overlay a.title-print-link:hover,
    #title-overlay a.title-print-link:focus-visible {
      transform: translateY(-1px);
    }

    #title-overlay a.title-print-link:hover h1,
    #title-overlay a.title-print-link:focus-visible h1 {
      color: #ffffff;
      text-shadow:
        0 0 12px rgba(100, 200, 255, 0.75),
        0 0 28px rgba(64, 224, 255, 0.45),
        0 2px 10px rgba(0, 0, 0, 0.85);
    }

    #title-overlay a.title-print-link:focus-visible {
      outline: 1px solid rgba(64, 224, 255, 0.7);
      outline-offset: 4px;
    }

    #title-overlay p {
      font-family: "Source Sans 3", sans-serif;
      font-size: clamp(12px, 2.4vw, 14px);
      font-weight: 500;
      letter-spacing: 0.04em;
      margin: 6px 0 0;
      color: color-mix(in srgb, var(--hud-accent) 75%, #e8f4ff);
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.55);
    }

    /* Fixed-screen mindscape labels (mini HUD plates) */
    #label-layer {
      position: fixed;
      inset: 0;
      z-index: 12;
      pointer-events: none;
      overflow: hidden;
    }
    .ms-label {
      --ms-accent: #40e0ff;
      position: absolute;
      left: 0;
      top: 0;
      display: inline-flex;
      align-items: stretch;
      max-width: min(240px, 42vw);
      margin: 0;
      padding: 0;
      border: 1px solid color-mix(in srgb, var(--ms-accent) 60%, transparent);
      background:
        linear-gradient(165deg, rgba(14, 32, 58, 0.55), rgba(4, 10, 22, 0.48)),
        rgba(4, 10, 22, 0.42);
      backdrop-filter: blur(12px) saturate(1.25);
      -webkit-backdrop-filter: blur(12px) saturate(1.25);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.3) inset,
        0 0 14px color-mix(in srgb, var(--ms-accent) 22%, transparent);
      color: #f2f7ff;
      font-family: Orbitron, sans-serif;
      text-align: left;
      cursor: pointer;
      pointer-events: auto;
      will-change: transform;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.18s ease;
    }
    .ms-label.is-visible {
      opacity: 1;
      visibility: visible;
    }
    .ms-label-bar {
      width: 4px;
      flex-shrink: 0;
      background: var(--ms-accent);
    }
    .ms-label-text {
      padding: 5px 9px 5px 8px;
      line-height: 1.25;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.65);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ms-label-theme .ms-label-text {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 7px 11px 7px 10px;
    }
    .ms-label-project .ms-label-text {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .ms-label:hover,
    .ms-label:focus-visible {
      border-color: color-mix(in srgb, var(--ms-accent) 90%, white);
      outline: none;
    }

    /* Sci-fi HUD — right deck on desktop, bottom sheet on mobile.
       Container never captures clicks; only .hud-panel does, so stars stay pickable. */
    #hud {
      --hud-accent: #40e0ff;
      position: fixed;
      top: 0;
      right: 0;
      width: min(420px, 42vw);
      height: 100%;
      z-index: 20;
      pointer-events: none;
      transform: translateX(105%);
      /* close = mirrored ease of open */
      transition: transform 0.45s cubic-bezier(0.64, 0, 0.78, 0);
      padding: 18px;
    }
    #hud.open {
      transform: translateX(0);
      transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }
    .hud-panel {
      position: relative;
      height: calc(100% - 8px);
      overflow: auto;
      padding: 22px 20px 28px;
      pointer-events: none;
      background-color: rgba(4, 10, 22, 0.38);
      background-image:
        linear-gradient(165deg, rgba(14,32,58,0.32), rgba(4,10,22,0.28)),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(120, 200, 255, 0.035) 3px,
          rgba(120, 200, 255, 0.035) 4px
        );
      backdrop-filter: blur(22px) saturate(1.35);
      -webkit-backdrop-filter: blur(22px) saturate(1.35);
      border: 1px solid color-mix(in srgb, var(--hud-accent) 65%, transparent);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.35) inset,
        0 0 28px color-mix(in srgb, var(--hud-accent) 28%, transparent),
        0 0 60px color-mix(in srgb, var(--hud-accent) 12%, transparent),
        -12px 0 36px rgba(0,0,0,0.35);
      clip-path: polygon(
        0 14px, 14px 0, calc(100% - 14px) 0, 100% 14px,
        100% calc(100% - 14px), calc(100% - 14px) 100%,
        14px 100%, 0 calc(100% - 14px)
      );
    }
    #hud.open .hud-panel {
      pointer-events: auto;
    }
    .hud-panel::before,
    .hud-panel::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid var(--hud-accent);
      opacity: 0.85;
    }
    .hud-panel::before { top: 8px; left: 8px; border-right: 0; border-bottom: 0; }
    .hud-panel::after { bottom: 8px; right: 8px; border-left: 0; border-top: 0; }
    .hud-kicker {
      font-family: Orbitron, sans-serif;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--hud-accent);
      margin-bottom: 6px;
    }
    .hud-project {
      font-family: Orbitron, sans-serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
      margin: 0 0 10px;
      color: #f2f7ff;
      text-shadow: 0 1px 8px rgba(0,0,0,0.65);
    }
    .hud-readouts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .hud-chip {
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.08);
      padding: 8px 10px;
      font-size: 12px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.45);
    }
    .hud-chip span {
      display: block;
      font-family: Orbitron, sans-serif;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(180,210,255,0.65);
      margin-bottom: 3px;
    }
    .hud-bullet {
      font-size: 16px;
      line-height: 1.55;
      color: #e8f0ff;
      margin: 0 0 18px;
      padding: 12px 0;
      border-top: 1px solid rgba(255,255,255,0.14);
      border-bottom: 1px solid rgba(255,255,255,0.14);
      text-shadow: 0 1px 6px rgba(0,0,0,0.55);
    }
    .hud-index {
      font-family: Orbitron, sans-serif;
      font-size: 10px;
      letter-spacing: 0.16em;
      color: rgba(160,200,255,0.7);
      margin-bottom: 14px;
    }
    .hud-image {
      margin: 0 0 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.35);
    }
    .hud-image img {
      display: block;
      width: 100%;
      height: auto;
      vertical-align: top;
    }
    .hud-video {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      margin: 0 0 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .hud-video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .hud-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .hud-links a {
      font-family: Orbitron, sans-serif;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      color: #041018;
      background: var(--hud-accent);
      padding: 8px 12px;
    }
    #hud-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      z-index: 2;
    }
    #hud-close:hover { border-color: var(--hud-accent); color: var(--hud-accent); }

    .hud-connected {
      margin-top: 14px;
    }
    .hud-connected-title {
      font-family: Orbitron, sans-serif;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--hud-accent);
      margin: 0 0 8px;
    }
    .hud-connected-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .hud-connected-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 100%;
      padding: 6px 10px 6px 8px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.07);
      color: #eef5ff;
      font-family: Orbitron, sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-align: left;
      cursor: pointer;
      pointer-events: auto;
    }
    .hud-connected-chip:hover,
    .hud-connected-chip:focus-visible {
      border-color: color-mix(in srgb, var(--hud-accent) 80%, white);
      outline: none;
    }
    .hud-connected-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 8px currentColor;
    }

    @media (max-width: 768px) {
      #title-overlay {
        top: 10px;
        padding: 10px 14px 11px;
        max-width: calc(100vw - 16px);
      }
      #controls {
        bottom: 10px;
        left: 10px;
        right: 10px;
        max-width: none;
        font-size: 12px;
      }
      #hud {
        top: auto;
        bottom: 0;
        right: 0;
        left: 0;
        width: 100%;
        height: min(58vh, 520px);
        transform: translateY(110%);
        padding: 10px;
      }
      #hud.open { transform: translateY(0); }
      .hud-panel {
        clip-path: polygon(
          0 12px, 12px 0, calc(100% - 12px) 0, 100% 12px,
          100% 100%, 0 100%
        );
      }
    }

    @media print {
      body {
        overflow: visible !important;
        background: #fff !important;
        color: #000 !important;
      }

      #canvas-container,
      #controls,
      #ui-overlay,
      #title-overlay,
      #loading,
      #hud {
        display: none !important;
      }

      #print-view {
        display: block !important;
      }
    }

    /* Print layout CSS lives in src/print/print-styles.css (imported by main.js). */
    #print-view { display: none; }

    /* Warp tour countdown bar */
    #warp-bar {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 25;
      width: min(420px, calc(100vw - 32px));
      padding: 12px 16px 14px;
      pointer-events: none;
      background: rgba(4, 12, 28, 0.55);
      border: 1px solid rgba(64, 224, 255, 0.55);
      box-shadow: 0 0 24px rgba(64, 224, 255, 0.18), inset 0 0 20px rgba(64, 224, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
    }
    #warp-bar[hidden] { display: none !important; }
    #warp-bar .warp-label {
      font-family: Orbitron, sans-serif;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: #d7f7ff;
      text-align: center;
      margin: 0 0 8px;
    }
    #warp-bar .warp-track {
      height: 4px;
      background: rgba(255,255,255,0.12);
      overflow: hidden;
    }
    #warp-bar .warp-fill {
      height: 100%;
      width: 100%;
      transform-origin: left center;
      background: linear-gradient(90deg, #40e0ff, #7aa7ff);
      box-shadow: 0 0 10px rgba(64,224,255,0.6);
      transform: scaleX(1);
    }

    /* Title long-press print menu */
    #print-style-menu {
      position: fixed;
      z-index: 40;
      width: 260px;
      padding: 10px;
      background: rgba(4, 12, 28, 0.92);
      border: 1px solid rgba(64, 224, 255, 0.55);
      box-shadow: 0 0 28px rgba(64, 224, 255, 0.22);
      backdrop-filter: blur(12px);
      color: #e8f6ff;
      font-family: "Source Sans 3", sans-serif;
    }
    #print-style-menu[hidden] { display: none !important; }
    #print-style-menu .psm-title {
      font-family: Orbitron, sans-serif;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0 0 8px;
      color: #9eecff;
    }
    #print-style-menu .psm-section {
      font-family: Orbitron, sans-serif;
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(180,220,255,0.65);
      margin: 8px 0 4px;
    }
    #print-style-menu .psm-item {
      display: block;
      text-decoration: none;
      color: #eef8ff;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 4px;
    }
    #print-style-menu .psm-item:hover {
      border-color: rgba(64,224,255,0.45);
      background: rgba(64,224,255,0.08);
    }
    #print-style-menu .psm-label {
      font-family: Orbitron, sans-serif;
      font-size: 11px;
      letter-spacing: 0.04em;
      display: block;
    }
    #print-style-menu .psm-desc {
      font-size: 11px;
      color: rgba(200,220,240,0.7);
    }

  </style>
  <script type="module" crossorigin src="/cv/assets/main-B-NoMZl0.js"></script>
  <link rel="stylesheet" crossorigin href="/cv/assets/main-B3qKxleE.css">
</head>
<body>
  <div id="loading">
    <img src="/cv/logo.png" alt="Christophe de Dinechin">
    <p>Loading constellation...</p>
  </div>

  <div id="canvas-container"></div>

  <div id="ui-overlay"></div>

  <div id="title-overlay">
    <a class="title-print-link" href="/cv/?print=1" title="Printable CV" aria-label="Open printable CV">
      <h1>Christophe de Dinechin</h1>
    </a>
    <p>Software as a Passion</p>
  </div>

  <div id="controls">
    <h3>Navigation</h3>
    <p><span class="control-key">Click</span> a CV bullet-star</p>
    <p><span class="control-key">Drag</span> to orbit</p>
    <p><span class="control-key">Scroll</span> to zoom</p>
    <p><span class="control-key">O</span> Overview</p>
    <p><span class="control-key">ESC</span> Close HUD</p>
  </div>

  <div id="label-layer" aria-hidden="true"></div>

  <aside id="hud" aria-hidden="true">
    <div class="hud-panel">
      <button id="hud-close" type="button" aria-label="Close">×</button>
      <div class="hud-kicker" data-hud="theme">THEME</div>
      <h2 class="hud-project" data-hud="project">Project</h2>
      <div class="hud-index" data-hud="index">NODE 000 / 000</div>
      <div class="hud-readouts">
        <div class="hud-chip"><span>Section</span><div data-hud="section">—</div></div>
        <div class="hud-chip"><span>Years</span><div data-hud="years">—</div></div>
      </div>
      <p class="hud-bullet" data-hud="bullet"></p>
      <div data-hud="media"></div>
      <div class="hud-connected" data-hud="connected" hidden>
        <h3 class="hud-connected-title">Connected topics</h3>
        <div class="hud-connected-list" data-hud="connected-list"></div>
      </div>
    </div>
  </aside>

  <div id="print-view"></div>

  <div id="warp-bar" hidden aria-hidden="true">
    <p class="warp-label" data-warp-label>NEXT WARP JUMP IN 10 SECONDS</p>
    <div class="warp-track"><div class="warp-fill" data-warp-fill></div></div>
  </div>

  <div id="print-style-menu" hidden aria-hidden="true" role="menu"></div>

</body>
</html>
