name: Build CV Constellation

on:
  push:
    branches: [master, cursor/3d-cv-constellation-36d1]
    paths:
      - 'cv-source/**'
      - '.github/workflows/build-cv.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vite 8 / rolldown needs Node ≥20 (node:util.styleText). Node 18 breaks `vite build`.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: cv-source/package-lock.json

      - name: Install dependencies
        run: cd cv-source && npm ci

      - name: Check topic media (reject block/error captures)
        run: cd cv-source && npm run check:media

      - name: Build
        run: cd cv-source && npm run build

      - name: Verify dist is complete
        run: |
          set -euo pipefail
          test -f cv-source/dist/index.html
          test -f cv-source/dist/content-data.json
          test -f cv-source/dist/build-meta.json
          js=$(find cv-source/dist/assets -maxdepth 1 -name 'main-*.js' | head -1)
          css=$(find cv-source/dist/assets -maxdepth 1 -name 'main-*.css' | head -1)
          test -n "$js"
          test -n "$css"
          # index must reference the hashed assets that exist
          jsbase=$(basename "$js")
          cssbase=$(basename "$css")
          grep -q "$jsbase" cv-source/dist/index.html
          grep -q "$cssbase" cv-source/dist/index.html
          # media folder should contain topic stills
          test -d cv-source/dist/media
          count=$(find cv-source/dist/media -type f | wc -l)
          test "$count" -ge 10
          echo "dist ok: $jsbase $cssbase media_files=$count"

      - name: Install Chromium for PDF export
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium || true
          cd cv-source && npm install --no-save puppeteer-core@23

      - name: Generate A4 PDFs per print style
        env:
          CHROME_PATH: /usr/bin/chromium-browser
        run: |
          # Fallbacks for Chrome binary location on ubuntu-latest
          if [ ! -x "$CHROME_PATH" ]; then
            for c in /usr/bin/chromium /usr/bin/google-chrome-stable /usr/bin/google-chrome; do
              if [ -x "$c" ]; then export CHROME_PATH="$c"; break; fi
            done
          fi
          cd cv-source && npm run generate-pdfs || echo "PDF generation skipped (no headless browser)"
          mkdir -p cv-source/dist/pdf
          # Prefer freshly generated PDFs when present
          if ls cv-source/pdf/*.pdf >/dev/null 2>&1; then
            cp cv-source/pdf/*.pdf cv-source/dist/pdf/ || true
          fi

      - name: Deploy to cv/
        run: |
          set -euo pipefail
          # Atomic replace so Pages never serves a half-written tree
          rm -rf cv.next
          mkdir cv.next
          cp -a cv-source/dist/. cv.next/
          # Keep previously published PDFs if this run skipped generation
          if [ -d cv/pdf ] && [ ! -f cv.next/pdf/classic.pdf ]; then
            mkdir -p cv.next/pdf
            cp -n cv/pdf/*.pdf cv.next/pdf/ 2>/dev/null || true
          fi
          rm -rf cv
          mv cv.next cv
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A cv/
          git commit -m "Deploy CV constellation [skip ci]" || echo "No changes to deploy"
          git push || echo "Nothing to push"
