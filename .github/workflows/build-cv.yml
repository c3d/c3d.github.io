name: Build CV Constellation

on:
  push:
    branches: [master, cursor/3d-cv-constellation-36d1]
    paths:
      - 'cv-source/**'
      - '.github/workflows/build-cv.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: cv-source/package-lock.json
      
      - name: Install dependencies
        run: cd cv-source && npm ci

      - name: Check topic media (reject block/error captures)
        run: cd cv-source && npm run check:media
      
      - name: Build
        run: cd cv-source && npm run build

      - name: Install Chromium for PDF export
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium || true
          cd cv-source && npm install --no-save puppeteer-core@23

      - name: Generate A4 PDFs per print style
        env:
          CHROME_PATH: /usr/bin/chromium-browser
        run: |
          # Fallbacks for Chrome binary location on ubuntu-latest
          if [ ! -x "$CHROME_PATH" ]; then
            for c in /usr/bin/chromium /usr/bin/google-chrome-stable /usr/bin/google-chrome; do
              if [ -x "$c" ]; then export CHROME_PATH="$c"; break; fi
            done
          fi
          cd cv-source && npm run generate-pdfs || echo "PDF generation skipped (no headless browser)"
      
      - name: Deploy to cv/
        run: |
          rm -rf cv/*
          cp -r cv-source/dist/* cv/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cv/
          git commit -m "Deploy CV constellation [skip ci]" || echo "No changes to deploy"
          git push || echo "Nothing to push"
